.messages{display:flex;flex-direction:column;gap:30px;padding-top:18px}.msg{display:flex;gap:13px;align-items:flex-start}.msg.user{justify-content:flex-end}.avatar{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,#397df4,#36a9a0);color:#fff;font-size:9px;font-weight:700;box-shadow:0 6px 18px rgba(57,125,244,.15)}.msg.user .avatar{order:2;background:#eef3f9;color:#6f829a;box-shadow:none}.content{max-width:min(760px,91%)}.msg.user .content{display:flex;justify-content:flex-end}.bubble{font-size:13px;line-height:1.84;color:#263a54}.msg.user .bubble{background:rgba(230,239,251,.78);border:1px solid rgba(116,149,192,.14);border-radius:20px 7px 20px 20px;padding:12px 16px;max-width:680px;box-shadow:0 8px 24px rgba(77,109,151,.05)}.msg.ai .bubble{padding-top:3px}.bubble p{margin:4px 0 10px}.bubble h3{font-size:15px;margin:15px 0 7px;color:#1b304b}.bubble ul{padding-left:20px}.meta{font-size:9px;color:#9aa9bb;margin-top:7px}

lor:#fff;box-shadow:0 9px 24px rgba(57,125,244,.25);transition:.16s}.send-btn:hover{transform:translateY(-1px) scale(1.02);box-shadow:0 12px 30px rgba(57,125,244,.30)}.send-btn:disabled{opacity:.38;transform:none;box-shadow:none}.send-btn svg{width:21px;height:21px;stroke-width:2.1}
.file-chip .file-chip>div{display:flex;flex-direction:column;gap:1px}

<body data-ui-version="8.6-user-first">
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M16 3.5c4.2 5.8 8.8 10.4 8.8 16A8.8 8.8 0 1 1 7.2 19.5c0-5.6 4.6-10.2 8.8-16Z"/><path class="brand-wave" d="M10.2 20.6c3.8-2.2 7.7 2.1 11.6-.2"/></svg>
        </span>
        <span><b>WaterPulse</b><small>AI Risk Copilot</small></span>
      </div>

      <div class="top-actions">
        <button id="newChatBtn" class="new-chat-btn" title="开始新对话">
          <span>＋</span><em>新对话</em>
        </button>
        <div id="aiStatus" class="model-pill"><i></i><span>服务检查中</span></div>
      </div>
    </header>

    <main class="chat-page">
      <section id="welcome" class="welcome">
        <div class="hero-kicker"><span>✦</span> 科技型农食企业 · 上游供应链水风险智能决策</div>
        <h1>看见上游风险，<br/><span>做出更稳决策</span></h1>
        <p class="welcome-intro">你好，我是 WaterPulse。你可以直接告诉我想了解的原材料、供应地区或风险问题，也可以上传 ESG 报告或采购资料。<br/>我会先理解你的需求，再判断还需要哪些信息；资料足够后，我会自动完成风险分析、不同压力情况下的比较，并给出清晰的关注重点和行动建议。</p>
      </section>
      <section id="messages" class="messages" aria-live="polite"></section>
    </main>

    <footer class="composer-wrap">
      <div class="composer">
        <div class="composer-main">
          <textarea id="messageInput" rows="1" placeholder="比如：请帮我看看中国大豆上游可能有哪些水风险？"></textarea>
        </div>
        <div class="composer-bottom">
          <div class="left-tools">
            <button id="attachBtn" class="tool-btn" title="上传 PDF / Word / Excel / CSV" aria-label="上传文件">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <input id="fileInput" type="file" accept=".pdf,.docx,.xlsx,.xls,.csv" hidden/>
            <a class="tool-link" href="/api/template" title="下载标准 Excel 模板">
              <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14"/></svg><span>Excel 模板</span>
            </a>
            <button id="micBtn" class="tool-btn mic" title="语音输入（浏览器支持时可用）" aria-label="语音输入">
              <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v4M9 21h6"/></svg>
            </button>
          </div>
          <button id="sendBtn" class="send-btn" title="发送" aria-label="发送">
            <svg viewBox="0 0 24 24"><path d="M12 19V5m0 0-5 5m5-5 5 5"/></svg>
          </button>
        </div>
      </div>
      <div class="hint"><span></span>可上传 ESG / 采购资料 · 关键数据由你确认 · 分析过程可展开查看</div>
    </footer>
  </div>
  <div id="toast" class="toast"></div>
  <script id="waterpulse-inline-app">
const $ = s => document.querySelector(s);
const state = {
  sessionId: localStorage.getItem('waterpulse_v5_session') || '',
  file: null,
  busy: false
};
const els = {
  welcome: $('#welcome'), messages: $('#messages'), input: $('#messageInput'), file: $('#fileInput'),
  send: $('#sendBtn'), toast: $('#toast'), attach: $('#attachBtn')
};

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(t){els.toast.textContent=t;els.toast.classList.add('show');setTimeout(()=>els.toast.classList.remove('show'),2200)}
function isMissing(v){return v===null||v===undefined||v===''||(typeof v==='number'&&!Number.isFinite(v))}
function fmt(v,n=4){if(isMissing(v))return'不可计算';const x=Number(v);return Number.isFinite(x)?x.toFixed(n):'不可计算'}
function pct(v){if(isMissing(v))return'不可计算';const x=Number(v);return Number.isFinite(x)?(x*100).toFixed(1)+'%':'不可计算'}
function md(text=''){
  let s=esc(text);
  s=s.replace(/^###\s+(.+)$/gm,'<h3>$1</h3>');
  s=s.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/^[-•]\s+(.+)$/gm,'<li>$1</li>');
  s=s.replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m+'</ul>');
  s=s.replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');
  return '<p>'+s+'</p>';
}
function showMessages(){els.welcome.style.display='none';document.body.classList.add('chatting')}
function scrollBottom(){setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),40)}
function resize(){els.input.style.height='auto';els.input.style.height=Math.min(150,els.input.scrollHeight)+'px'}
const HISTORY_KEY='waterpulse_history_v2';
function loadHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch{return[]}}
function saveHistoryItem(item){try{const arr=loadHistory();arr.push(item);localStorage.setItem(HISTORY_KEY,JSON.stringify(arr.slice(-24)))}catch{}}
function clearHistory(){try{localStorage.removeItem(HISTORY_KEY)}catch{}}
function setFile(f){
  state.file=f||null;
  if(els.attach){
    els.attach.classList.toggle('has-file',!!f);
    els.attach.title=f?('已选择：'+f.name+'（再次点击可更换文件）'):'上传 PDF / Word / Excel / CSV';
  }
  if(f){toast('已添加文件：'+f.name)}
  else if(els.file){els.file.value=''}
}

function addUser(text,file,save=true){
  showMessages();
  const el=document.createElement('div'); el.className='msg user';
  el.innerHTML=`<div class="content"><div class="bubble">${text?esc(text):'请分析这个文件'}${file?`<div style="margin-top:8px;font-size:10px;opacity:.78">📎 ${esc(file.name)}</div>`:''}</div></div><div class="avatar">你</div>`;
  els.messages.appendChild(el); if(save)saveHistoryItem({type:'user',text:text||'',fileName:file?.name||''}); scrollBottom();
}
function traceHtml(trace=[]){
  if(!trace.length)return'';
  return `<details class="trace-box"><summary>查看分析过程 · ${trace.length} 项</summary><div class="trace-list">${trace.map(x=>`<div class="trace-item ${esc(x.status||'done')}"><i class="trace-dot"></i><div><div class="trace-title">${esc(x.step)}</div>${x.detail?`<div class="trace-detail">${esc(x.detail)}</div>`:''}</div></div>`).join('')}</div></details>`;
}
function actionHtml(actions=[]){
  if(!actions.length)return'';
  return `<div class="actions">${actions.map((a,i)=>`<button class="action-btn ${i===0?'primary':''}" data-action="${encodeURIComponent(JSON.stringify(a))}">${esc(a.label)}</button>`).join('')}</div>`;
}
function sourceDetailsHtml(b){
  const details=b?.source_details||[];const proxy=b?.proxy_fields||[];const assumptions=b?.assumptions||[];
  if(!details.length&&!proxy.length&&!assumptions.length)return'';
  const rows=details.slice(0,12).map(d=>`<div class="source-row"><b>${esc(d.kind==='water_risk'?(d.node_name||d.node_id||'供应地数据'):(d.material||'材料参数'))}</b><span>${esc(d.source_ref||'来源待补')}</span><span>${esc(d.reference_period||'参考期待补')}</span><span>${esc(d.data_type||'身份待补')} · ${esc(d.confidence||'置信度待补')}</span></div>`).join('');
  return `<details class="trace-box source-box"><summary>查看来源与数据说明</summary><div class="trace-list">${(proxy.length||assumptions.length)?`<div class="trace-detail" style="margin-bottom:8px">${proxy.length?'含代理数据 '+proxy.length+' 项。 ':''}${assumptions.length?'含假设 '+assumptions.length+' 项。 ':''}“可完整计算”不等于所有输入均已真实核验。</div>`:''}${rows}<div class="trace-detail" style="margin-top:8px">当前项目登记来源中的原始机构链接仍需数据负责人补齐；系统不会把项目文件名伪装成原始数据库链接。</div></div></details>`;
}
function baselineCard(b){
  const rows=b?.data?.summary;if(!Array.isArray(rows)||!rows.length)return'';const nodes=Array.isArray(b?.data?.nodes)?b.data.nodes:[];
  return rows.map(r=>{
    const gn=nodes.filter(x=>x.material===r.material);const top=gn.slice().sort((a,c)=>(Number(c.C)||-1)-(Number(a.C)||-1))[0]||{};
    const pr=Number(r.PRWI);const ws=(!isMissing(r.path_contrib_WS)&&Number.isFinite(pr)&&pr!==0)?Number(r.path_contrib_WS)/pr:null;
    const dr=(!isMissing(r.path_contrib_DR)&&Number.isFinite(pr)&&pr!==0)?Number(r.path_contrib_DR)/pr:null;
    const sv=(!isMissing(r.path_contrib_SV)&&Number.isFinite(pr)&&pr!==0)?Number(r.path_contrib_SV)/pr:null;
    const identity=b?.data_identity?.label||((b?.proxy_fields?.length||b?.assumptions?.length)?'含代理/假设':'');
    return `<div class="result-card"><div class="result-title">${esc(r.enterprise||'企业')} · ${esc(r.material||'原材料')}${identity?` · ${esc(identity)}`:''}</div><div class="metrics">
      <div class="metric"><span>综合风险指数</span><b>${fmt(r.PRWI)}</b></div>
      <div class="metric"><span>最大贡献供应地</span><b style="font-size:11px">${esc(top.node_name||top.node_id||'不可计算')}</b></div>
      <div class="metric"><span>数据可信程度</span><b>${esc(r.overall_confidence||'Unknown')}</b></div>
      <div class="metric"><span>未识别采购份额</span><b>${pct(r.unknown_share_U)}</b></div>
    </div><div class="metrics" style="margin-top:9px">
      <div class="metric"><span>长期缺水贡献</span><b>${pct(ws)}</b></div><div class="metric"><span>历史干旱贡献</span><b>${pct(dr)}</b></div><div class="metric"><span>季节波动贡献</span><b>${pct(sv)}</b></div><div class="metric"><span>有效数据覆盖</span><b>${pct(r.scored_coverage ?? r.Coverage)}</b></div>
    </div>${sourceDetailsHtml(b)}</div>`;
  }).join('');
}
function scenarioCard(s){
  const d=s?.data;if(!d||typeof d!=='object')return'';const t=d.scenario_type||'';
  const names={NodeFailure:'主要供应节点中断',AqueductFuture:'未来水环境变化',PeakSeason:'关键用水期压力升高',ExtremeDrought:'严重干旱重现'};let metrics=[];
  if(t==='NodeFailure')metrics=[['原材料',d.material||'—'],['受影响供应地',d.target_node_name||d.target_node_id||'—'],['影响比例',pct(d.failure_fraction_f)],['预计供应损失',fmt(d.gross_loss)],['未满足需求',fmt(d.unmet_demand)],['剩余供应综合风险',fmt(d.conditional_PRWI)]];
  else if(t==='AqueductFuture')metrics=[['原材料',d.material||'—'],['当前综合风险',fmt(d.PRWI_baseline)],['变化后综合风险',fmt(d.PRWI_future)],['变化值',fmt(d.PRWI_delta)],['假设路径',d.path||'—'],['年份',d.year??'—']];
  else metrics=[['原材料',d.material||'—'],['当前综合风险',fmt(d.PRWI_baseline)],['变化后综合风险',fmt(d.PRWI_scenario)],['变化值',fmt(d.PRWI_delta)],['情况',names[t]||t||'压力比较']];
  return `<div class="result-card"><div class="result-title">${esc(names[t]||'不同情况下的变化')}</div><div class="metrics">${metrics.map(([k,v])=>`<div class="metric"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div></div>`;
}

function addAI(data,save=true){
  showMessages();
  const el=document.createElement('div');el.className='msg ai';
  const provider=data.ai?.provider==='DeepSeek'?`DeepSeek · ${esc(data.ai.model||'')}`:'本地安全模板';
  const result=(data.result_summary?.baseline?baselineCard(data.result_summary.baseline):'')+(data.result_summary?.scenario?scenarioCard(data.result_summary.scenario):'');
  el.innerHTML=`<div class="avatar">AI</div><div class="content"><div class="bubble">${md(data.message||'')}${result}${actionHtml(data.actions||[])}${traceHtml(data.trace||[])}</div><div class="meta">WaterPulse AI · ${provider}</div></div>`;
  els.messages.appendChild(el); if(save)saveHistoryItem({type:'ai',data}); bindActions(el); scrollBottom();
}
function addTyping(){showMessages();const el=document.createElement('div');el.id='typingMsg';el.className='msg ai';el.innerHTML='<div class="avatar">AI</div><div class="content"><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div></div>';els.messages.appendChild(el);scrollBottom()}
function removeTyping(){$('#typingMsg')?.remove()}

async function callAgent({message='',action='',scenario_type='',material='',year='',path='',failure_fraction='',inventory='',file=null}={}){
  if(state.busy)return; state.busy=true; els.send.disabled=true; addTyping();
  try{
    const fd=new FormData();
    fd.append('session_id',state.sessionId);fd.append('message',message);fd.append('action',action);fd.append('scenario_type',scenario_type);fd.append('material',material);
    fd.append('year',year);fd.append('path',path);fd.append('failure_fraction',failure_fraction);fd.append('inventory',inventory);if(file)fd.append('file',file);
    const r=await fetch('/api/agent/message',{method:'POST',body:fd});
    const data=await r.json(); if(!r.ok)throw new Error(data.detail||'请求失败');
    if(data.session_id){state.sessionId=data.session_id;localStorage.setItem('waterpulse_v5_session',state.sessionId)}
    removeTyping();addAI(data);return data;
  }catch(e){removeTyping();addAI({message:'这次请求没有完成。请检查网络或后端服务后重试。',trace:[{step:'请求失败',status:'error',detail:String(e)}]})}
  finally{state.busy=false;els.send.disabled=false}
}
async function send(){
  const text=els.input.value.trim();const f=state.file;if(!text&&!f)return;
  addUser(text,f);els.input.value='';resize();setFile(null);await callAgent({message:text,file:f});
}
function bindActions(root=document){
  root.querySelectorAll('.action-btn').forEach(btn=>btn.onclick=async()=>{
    let a={};try{a=JSON.parse(decodeURIComponent(btn.dataset.action))}catch{}
    if(a.action==='download_template'){location.href='/api/template';return}
    if(a.action==='focus_upload'){els.file.click();return}
    if(a.action==='download_report'){if(!state.sessionId){toast('当前没有分析会话');return}location.href='/api/agent/report/'+encodeURIComponent(state.sessionId);return}
    addUser(a.label);
    await callAgent({action:a.action||'',scenario_type:a.scenario_type||'',material:a.material||'',year:a.year||'',path:a.path||'',failure_fraction:a.failure_fraction??'',inventory:a.inventory??'',message:a.label});
  })
}
function reset(){
  state.sessionId='';localStorage.removeItem('waterpulse_v5_session');clearHistory();state.file=null;els.messages.innerHTML='';els.welcome.style.display='block';document.body.classList.remove('chatting');setFile(null);els.input.value='';resize();
}

$('#attachBtn').onclick=()=>els.file.click();els.file.onchange=()=>setFile(els.file.files?.[0]);els.send.onclick=send;
els.input.addEventListener('input',resize);els.input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#newChatBtn').onclick=reset;

async function fetchJsonWithTimeout(url, options={}, timeoutMs=8000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{
    const r=await fetch(url,{...options,signal:controller.signal,cache:'no-store'});
    const d=await r.json();
    return {response:r,data:d};
  }finally{clearTimeout(timer)}
}

async function init(){
  const badge=$('#aiStatus');
  try{
    const {response:r,data:d}=await fetchJsonWithTimeout('/api/agent/status',{},5000);
    if(!r.ok) throw new Error('status '+r.status);
    if(!d.deepseek_configured){
      badge.classList.remove('online');
      badge.classList.add('offline');
      badge.innerHTML='<i></i><span>DeepSeek 待配置</span>';
    }else{
      // The Railway variable is already visible to the service.
      badge.classList.remove('offline');
      badge.classList.add('online');
      badge.innerHTML='<i></i><span>DeepSeek 已配置</span>';
      try{
        const {response:tr,data:td}=await fetchJsonWithTimeout('/api/deepseek/test',{},10000);
        if(tr.ok && td.ok){
          badge.classList.remove('offline');
          badge.classList.add('online');
          badge.innerHTML='<i></i><span>DeepSeek 已连接</span>';
        }else{
          badge.classList.remove('online');
          badge.classList.add('offline');
          badge.innerHTML='<i></i><span>DeepSeek 已配置 · 连接待确认</span>';
          console.warn('DeepSeek connection test:',td);
        }
      }catch(e){
        badge.classList.remove('online');
        badge.classList.add('offline');
        badge.innerHTML='<i></i><span>DeepSeek 已配置 · 连接待确认</span>';
        console.warn('DeepSeek connection test failed:',e);
      }
    }
  }catch(e){
    badge.classList.remove('online');
    badge.classList.add('offline');
    badge.innerHTML='<i></i><span>AI 服务暂未连接</span>';
    console.warn('AI status check failed:',e);
  }
  const hist=loadHistory();
  if(hist.length){
    showMessages();
    hist.forEach(x=>{if(x.type==='user')addUser(x.text||'',x.fileName?{name:x.fileName}:null,false);else if(x.type==='ai')addAI(x.data||{},false)});
  }else if(state.sessionId){
    showMessages();addAI({message:'欢迎回来。之前的服务会话可能已过期；你仍可以继续提问或重新上传资料。',actions:[]},false);
  }
}

// Optional browser speech-to-text. It only fills the composer; no audio is uploaded.
(function setupSpeech(){
  const btn=document.querySelector('#micBtn');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!btn)return;
  if(!SR){btn.style.display='none';return;}
  const rec=new SR();rec.lang='zh-CN';rec.interimResults=true;rec.continuous=false;
  let base='';
  btn.onclick=()=>{try{base=els.input.value.trim();btn.classList.add('listening');toast('正在听…');rec.start()}catch{}};
  rec.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;els.input.value=(base?base+' ':'')+text;resize()};
  rec.onend=()=>btn.classList.remove('listening');
  rec.onerror=()=>{btn.classList.remove('listening');toast('语音输入暂不可用')};
})();

init();

  </script>

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.quick-prompts, .quick').forEach(el => el.remove());
});
